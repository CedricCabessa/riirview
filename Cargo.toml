[package]
name = "riirview"
version = "1.4.1"
edition = "2024"
build = "build.rs"

[dependencies]
# FIXME: version 8 doesn't work
ansi-to-tui = "7.0.0"
anyhow = "1.0.102"
chrono = { version = "0.4.43", features = ["serde"] }
chrono-humanize = "0.2.3"
diesel = { version = "2.3.6", features = ["chrono", "r2d2", "sqlite"] }
diesel_migrations = { version = "2.3.1", features = ["sqlite"] }
directories = "6.0.0"
dotenvy = "0.15.7"
futures = "0.3.32"
log = "0.4.29"
log4rs = "1.4.0"
open = "5.3.3"
rand = "0.10.0"
ratatui = "0.29.0"
regex = "1.12.3"
reqwest = { version = "0.12.28", features = ["json"] }
serde = { version = "1.0.228", features = ["derive"] }
tokio = { version = "1.49.0", features = ["macros", "rt-multi-thread", "sync", "time"] }
toml = "0.9.12"
tui-textarea = { version = "0.7.0", features = ["ratatui"] }
url = "2.5.8"

[dev-dependencies]
serde_json = "1.0.149"
mockito = "1.7.2"
tempfile = "3.25.0"

[build-dependencies]
vergen-git2 = "1.0.7"
