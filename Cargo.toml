[package]
name = "riirview"
version = "1.4.1"
edition = "2024"
build = "build.rs"

[dependencies]
anyhow = "1.0.100"
chrono = { version = "0.4.42", features = ["serde"] }
chrono-humanize = "0.2.3"
diesel = { version = "2.3.4", features = ["chrono", "r2d2", "sqlite"] }
diesel_migrations = { version = "2.3.1", features = ["sqlite"] }
directories = "6.0.0"
dotenvy = "0.15.7"
futures = "0.3.31"
log = "0.4.29"
log4rs = "1.4.0"
open = "5.3.3"
ratatui = "0.29.0"
regex = "1.12.2"
reqwest = { version = "0.12.24", features = ["json"] }
serde = { version = "1.0.228", features = ["derive"] }
tokio = { version = "1.48.0", features = ["full"] }
toml = "0.9.8"
tui-textarea = { version = "0.7.0", features = ["ratatui"] }
url = "2.5.7"

[dev-dependencies]
serde_json = "1.0.145"
mockito = "1.7.1"
tempfile = "3.23.0"

[build-dependencies]
vergen-git2 = "1.0.7"
